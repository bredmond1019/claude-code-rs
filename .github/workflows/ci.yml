name: ci

# Vendored from base-template's reusable gate-rust.yml (base-template 57d331f) with its
# defaults applied: fmt, clippy -D warnings, cargo test, release build. This repo stays
# public under brain decision D94 while base-template goes private, and GitHub shares a
# private repo's reusable workflows only with other private repos — so this caller can no
# longer `uses:` it. Re-sync by hand if base-template's gate changes.

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Mirrors base-template: a repo whose .cargo/config.toml sets
      # `build.rustc-wrapper = "sccache"` fails every cargo call without the binary.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test

      - name: build
        run: cargo build --release
